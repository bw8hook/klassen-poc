<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva de Passagens - Wireframe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">
                Klassen
            </a>
            <div class="d-flex">
                <span class="me-3 d-none d-md-inline text-muted small">Menu Item</span>
                <div style="width: 30px; height: 30px; background: #ccc; border-radius: 50%;"></div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <header class="hero">
        <div class="container text-center">
            <h1 class="display-5 fw-bold mb-2">Busca de Passagens</h1>
            <p class="text-muted">Selecione origem, destino e data para continuar</p>
        </div>
    </header>

    <!-- Search Section -->
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 search-container">
                <form id="search-form" class="row g-3">
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Motivo da Viagem</label>
                        <select class="form-select" id="travel-purpose">
                            <option value="lazer">Lazer</option>
                            <option value="trabalho">Trabalho</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Origem</label>
                        <input type="text" class="form-control" id="origin" placeholder="Cidade de Origem" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-bold">Destino</label>
                        <input type="text" class="form-control" id="destination" placeholder="Cidade de Destino" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small fw-bold">Data da Ida</label>
                        <input type="date" class="form-control" id="travel-date" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            BUSCAR
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Results Section -->
    <main id="view-results" class="results-section container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="results-title" class="fw-bold m-0">Passagens Disponíveis</h2>
            <span class="text-muted" id="results-date"></span>
        </div>
        <div id="trips-container">
            <!-- Dynamic cards will appear here -->
        </div>
    </main>

    <section id="view-seats" class="seat-section container">
        <div class="row">
            <div class="col-md-8">
                <div class="card p-4 mb-4">
                    <h5 class="fw-bold mb-4">Seleção de Assento</h5>
                    
                    <div class="bus-layout">
                        <div class="me-3 small text-muted text-center" style="writing-mode: vertical-lr; transform: rotate(180deg);">[FRENTE]</div>
                        <div class="seat-grid" id="seat-grid">
                            <!-- Seats generated by JS -->
                        </div>
                    </div>

                    <div class="seat-legend">
                        <div class="legend-item">
                            <div class="seat available" style="width:20px;height:20px"></div>
                            <span>Livre</span>
                        </div>
                        <div class="legend-item">
                            <div class="seat selected" style="width:20px;height:20px"></div>
                            <span>Selecionada</span>
                        </div>
                        <div class="legend-item">
                            <div class="seat occupied" style="width:20px;height:20px"></div>
                            <span>Ocupada</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-4">
                <div class="card border-0 shadow-sm p-4 sticky-top" style="top: 20px;">
                    <h4 class="fw-bold mb-3">Resumo da Viagem</h4>
                    <div id="selection-summary">
                        <p class="text-muted small">Nenhuma poltrona selecionada</p>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between fw-bold fs-5 mb-4">
                        <span>Total:</span>
                        <span id="total-price">R$ 0,00</span>
                    </div>
                    <button class="btn btn-accent w-100 py-3 d-none" id="btn-checkout">
                        RESERVAR AGORA
                    </button>
                    <button class="btn btn-outline-secondary w-100 mt-2" onclick="showResultsView()">
                        Voltar para Opções
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-light border-top py-4 mt-5">
        <div class="container text-center">
            <p class="mb-0 text-muted small">&copy; 2024 Bus Booking System - Wireframe Version</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
